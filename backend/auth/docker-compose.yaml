services:
  postgres:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql
  auth:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/sempoa
      REDIS_ADDR: redis:6379
    depends_on:
      - postgres
      - redis
  redis:
    hostname: redis
    image: redis:8-alpine
    ports:
      - "6379:6379"
    restart: on-failure

volumes:
  postgres_data: